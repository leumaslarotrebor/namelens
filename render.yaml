# Render Blueprint: API + PostgreSQL. Render → New → Blueprint → select this repo.
services:
  - type: web
    name: namelens-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase: { name: namelens-db, property: connectionString }
      - key: CORS_ORIGINS
        value: https://leumaslarotrebor.github.io
databases:
  - name: namelens-db
    plan: free
